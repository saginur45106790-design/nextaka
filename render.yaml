# Safe pre-launch installation. Free Postgres expires after 30 days.
# No live money; no paid cron is created by this file.
# Review limits/billing at https://render.com/docs/free before applying.
services:
  - type: web
    name: nextaka-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build --workspace backend
    # Free services do not provide the paid pre-deploy workflow.
    # Prisma migrations are serialized by PostgreSQL advisory locks.
    startCommand: npm run db:migrate --workspace backend && npm run db:seed --workspace backend && npm run start --workspace backend
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: nextaka-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: TURNSTILE_HOSTNAMES
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: AUTH_TEST_BYPASS
        value: "false"
      - key: FINANCIAL_ACTIVITY_ENABLED
        value: "false"
      - key: DURABLE_INFRASTRUCTURE_CONFIRMED
        value: "false"
      - key: COMPLIANCE_APPROVED
        value: "false"
      - key: PAYMENT_OPERATIONS_READY
        value: "false"
      - key: BACKUPS_RESTORE_TESTED
        value: "false"
      - key: SECURITY_REVIEW_APPROVED
        value: "false"
  - type: web
    name: nextaka
    runtime: static
    buildCommand: npm install --include=dev && npm run build --workspace frontend
    staticPublishPath: frontend/dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.onrender.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
databases:
  - name: nextaka-db
    databaseName: nextaka
    user: nextaka_owner
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    # Empty means no external connections. Same-region Render services connect internally.
    ipAllowList: []
